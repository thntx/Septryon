<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sèptryón</title>
    <style>
        @font-face {
            font-family: 'XSF Didona';
            src: url('fonts/XSF-Didona-Regular.woff2?v=2.006') format('woff2');
            font-display: swap;
        }
        :root { --bg: #121212; --text: #f0f0f0; }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html { height: 100%; }

        body {
            min-height: 100%;
            background: var(--bg); color: var(--text);
            display: flex; justify-content: center;
            overflow-y: auto;
        }

        #editor {
            width: 100%; max-width: 800px;
            padding: 40px 20px;
            font-family: 'XSF Didona', serif;
            font-size: 3rem;
            line-height: 1.5;
            font-kerning: normal;
            font-feature-settings: "kern" 1, "liga" 1, "calt" 1;
            outline: none;
            caret-color: var(--text);
            text-align: justify;
            white-space: pre-wrap;
        }

        #editor > div { margin-bottom: 0.6em; min-height: 1.5em; }

        /* Inline boxes preserve shaping across syllables, unlike wbr or inline-block. */
        .xsf-run { line-break: anywhere; white-space: pre-wrap; }
        .xsf-syllable { white-space: pre; word-break: normal; }
        .xsf-reset { white-space: pre; text-justify: none; }
        @supports not (text-justify: none) {
            #editor { text-align: start; }
            #editor > div:not(:has(.xsf-reset)) { text-align: justify; }
        }

        /* Keep the source in the editable text, including the native selection. */
        .md-syntax {
            font-family: ui-monospace, monospace;
            opacity: 0;
            font-size: 0;
            line-height: 0;
            white-space: pre;
            font-weight: normal;
            font-style: normal;
        }
        .md-syntax.is-editing {
            opacity: 0.6;
            font-size: 0.5em;
            line-height: normal;
        }

        /* Block-level */
        .line-h1, .line-h2, .line-h3 { font-weight: normal; line-height: 1.4; }
        .line-h1 { font-size: 1.65em; }
        .line-h2 { font-size: 1.4em; }
        .line-h3 { font-size: 1.25em; }
        .line-bq { border-left: 3px solid #444; padding-left: 0.8em; color: #999; }
        .line-li { padding-left: 0.5em; }
        #editor > div.line-center { text-align: center; }
        #editor > div.line-fit { text-align: start; white-space: nowrap; }
        .md-fit-content { display: inline-block; white-space: pre; }
        #editor > div.line-justify {
            text-align: start;
            text-align-last: start;
            white-space: nowrap;
            overflow-x: clip;
        }
        .line-justify .md-syntax,
        .line-justify .xsf-reset { word-spacing: normal; letter-spacing: normal; }
        .line-justify .md-track-end { letter-spacing: normal; }
        .line-justify .xsf-run { white-space: inherit; }
        .md-track-content { display: inline-block; white-space: pre; transform-origin: left center; }

        /* Inline */
        .md-bold { font-weight: bold; }
        .md-italic { font-style: italic; }
        .md-code {
            font-family: inherit;
            background: rgba(255,255,255,0.07);
            padding: 0.1em 0.35em;
            border-radius: 3px;
            font-size: 0.9em;
        }
        .md-strike { text-decoration: line-through; opacity: 0.6; }

        /* Scrollbar */
        body::-webkit-scrollbar { width: 6px; }
        body::-webkit-scrollbar-track { background: var(--bg); }
        body::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 3px; }
    </style>
</head>
<body>
    <div id="editor" contenteditable="true" role="textbox" aria-multiline="true" spellcheck="true" lang="en" data-empty="true"></div>
    <input type="file" id="fallbackFileInput" accept=".md,.txt,.markdown" style="display:none">

    <script src="xsf-syllables.js?v=4"></script>
    <script>
        const editor = document.getElementById('editor');
        const fallbackFileInput = document.getElementById('fallbackFileInput');
        const STORAGE_KEY = 'simple_editor_content';
        const widthDependentBlocks = '.line-fit, .line-justify';
        const graphemes = new Intl.Segmenter(undefined, { granularity: 'grapheme' });
        let saveTimeout;
        let fileHandle = null;

        document.execCommand('defaultParagraphSeparator', false, 'div');

        // ---- IndexedDB for FileHandle Persistence ----

        const DB_NAME = 'MarkdownEditorDB';
        const DB_STORE = 'handles';

        function getDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = () => req.result.createObjectStore(DB_STORE);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function getStoredHandle() {
            try {
                const db = await getDB();
                return new Promise((resolve) => {
                    const tx = db.transaction(DB_STORE, 'readonly');
                    const req = tx.objectStore(DB_STORE).get('synced_handle');
                    req.onsuccess = () => resolve(req.result || null);
                    req.onerror = () => resolve(null);
                });
            } catch { return null; }
        }

        async function setStoredHandle(handle) {
            try {
                const db = await getDB();
                const tx = db.transaction(DB_STORE, 'readwrite');
                tx.objectStore(DB_STORE).put(handle, 'synced_handle');
            } catch {}
        }

        // ---- Title Status ----

        function updateTitle(hasError = false) {
            if (fileHandle) {
                document.title = (hasError ? '⚠️ Error - ' : '● ') + fileHandle.name + ' - Sèptryón';
            } else {
                document.title = 'Sèptryón';
            }
        }

        // ---- Caret save / restore ----

        function saveCaretPos(el) {
            const sel = window.getSelection();
            if (!sel.rangeCount || !el.contains(sel.focusNode)) return null;
            const r = document.createRange();
            r.selectNodeContents(el);
            r.setEnd(sel.focusNode, sel.focusOffset);
            return r.toString().length;
        }

        function restoreCaretPos(el, offset) {
            if (offset === null) return;
            const sel = window.getSelection();
            const r = document.createRange();
            let cur = 0;
            const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
            while (walker.nextNode()) {
                const n = walker.currentNode;
                const len = n.textContent.length;
                if (cur + len >= offset) {
                    r.setStart(n, offset - cur);
                    r.collapse(true);
                    sel.removeAllRanges();
                    sel.addRange(r);
                    return;
                }
                cur += len;
            }
            r.selectNodeContents(el);
            r.collapse(false);
            sel.removeAllRanges();
            sel.addRange(r);
        }

        // ---- Active block ----

        function getActiveBlock() {
            const sel = window.getSelection();
            if (!sel.rangeCount) return null;
            let node = sel.focusNode;
            if (node === editor) return editor.children[sel.focusOffset] || editor.lastElementChild;
            while (node && node.parentNode !== editor) node = node.parentNode;
            return (node && node.parentNode === editor) ? node : null;
        }

        let shownSyntax = [];

        function updateSyntaxVisibility() {
            const sel = window.getSelection();
            let next = [];
            if (document.activeElement === editor && sel?.isCollapsed && editor.contains(sel.focusNode)) {
                const block = getActiveBlock();
                const node = sel.focusNode.nodeType === Node.TEXT_NODE ? sel.focusNode.parentElement : sel.focusNode;
                const inline = node.closest('.md-inline');
                const prefix = block?.firstElementChild;
                const prefixOffset = prefix?.classList.contains('md-prefix') ? saveCaretPos(block) : null;
                if (prefixOffset !== null && prefixOffset <= prefix.textContent.length) {
                    next = [prefix];
                } else if (inline) {
                    const offset = saveCaretPos(inline);
                    if (offset > 0 && offset < inline.textContent.length) {
                        next = [...inline.querySelectorAll(':scope > .md-syntax')];
                    }
                }
            }
            const relayout = new Set();
            for (const marker of shownSyntax) {
                if (next.includes(marker)) continue;
                marker.classList.remove('is-editing');
                relayout.add(marker.closest(widthDependentBlocks));
            }
            for (const marker of next) {
                if (shownSyntax.includes(marker)) continue;
                marker.classList.add('is-editing');
                relayout.add(marker.closest(widthDependentBlocks));
            }
            shownSyntax = next;
            for (const block of relayout) if (block?.isConnected) layoutBlock(block);
        }

        document.addEventListener('selectionchange', updateSyntaxVisibility);
        editor.addEventListener('blur', updateSyntaxVisibility);

        // ---- HTML escape ----

        function esc(t) {
            return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        // ---- Decoration engine ----

        function renderInline(text) {
            // Match source text, not generated HTML; code spans keep literal markers.
            const pattern = /(?<!\\)\x60(?<code>[^\x60]+)\x60|(?<![\\*])(?<em>\*{1,3})(?!\*)(?<styled>.+?)(?<![\\*])\k<em>(?!\*)|(?<!\\)~~(?<strike>.+?)(?<!\\)~~/g;
            let html = '', from = 0;
            for (const match of text.matchAll(pattern)) {
                const { code, em, styled, strike } = match.groups;
                const marker = code !== undefined ? '\x60' : em || '~~';
                const style = code !== undefined ? 'md-code' : !em ? 'md-strike' :
                    ['md-italic', 'md-bold', 'md-bold md-italic'][em.length - 1];
                const body = code !== undefined ? esc(code) : renderInline(styled ?? strike);
                const syntax = `<span class="md-syntax">${marker}</span>`;
                html += esc(text.slice(from, match.index)) +
                    `<span class="md-inline">${syntax}<span class="${style}">${body}</span>${syntax}</span>`;
                from = match.index + match[0].length;
            }
            return html + esc(text.slice(from));
        }

        function buildDecoration(raw) {
            let cls = '';
            let prefix = '';
            let content = raw;

            // Block-level patterns
            const blocks = [
                [/^(#{1,6}) (.*)$/, m => {
                    cls = 'line-h' + Math.min(m[1].length, 3);
                    prefix = m[1] + ' ';
                    content = m[2];
                }],
                [/^(> )(.*)$/, m => {
                    cls = 'line-bq';
                    prefix = m[1];
                    content = m[2];
                }],
                [/^([-*+] )(.*)$/, m => {
                    cls = 'line-li';
                    prefix = m[1];
                    content = m[2];
                }],
                [/^(\d+\. )(.*)$/, m => {
                    cls = 'line-li';
                    prefix = m[1];
                    content = m[2];
                }],
            ];

            for (const [re, handler] of blocks) {
                const m = content.match(re);
                if (m) { handler(m); break; }
            }

            const modifier = content.match(/^([|¬\\]) /);
            const modifierClasses = { '|': 'line-center', '¬': 'line-fit', '\\': 'line-justify' };
            const modifierClass = modifierClasses[modifier?.[1]];
            const contentClass = modifierClass === 'line-fit' ? 'md-fit-content' :
                modifierClass === 'line-justify' ? 'md-track-content' : '';
            if (modifier) {
                prefix += modifier[0];
                content = content.slice(modifier[0].length);
                cls = [cls, modifierClass].filter(Boolean).join(' ');
            }

            const marker = prefix ? `<span class="md-syntax md-prefix">${esc(prefix)}</span>` : '';
            const body = renderInline(content);
            return { html: marker + (contentClass ? `<span class="${contentClass}">${body}</span>` : body), cls };
        }

        function fitBlock(block) {
            const content = block.querySelector(':scope > .md-fit-content');
            if (!content) return;
            const prefix = content.previousElementSibling;
            const style = getComputedStyle(block);
            const available = block.getBoundingClientRect().width
                - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight)
                - parseFloat(style.borderLeftWidth) - parseFloat(style.borderRightWidth)
                - prefix.getBoundingClientRect().width;

            let size = parseFloat(style.fontSize);
            content.style.fontSize = '';
            // Measure the shaped line, including the font's ligatures and any inline styles.
            for (let pass = 0; pass < 4 && available > 0; pass++) {
                const width = content.getBoundingClientRect().width;
                if (!width || Math.abs(width - available) < 0.05) break;
                size *= available / width;
                content.style.fontSize = `${size}px`;
            }
        }

        function justifyLine(block) {
            const content = block.querySelector(':scope > .md-track-content');
            if (!content) return;
            content.style.wordSpacing = '';
            content.style.letterSpacing = '';
            content.style.transform = '';

            const last = [...content.querySelectorAll('.xsf-syllable')].at(-1);
            if (!last || document.fonts.status === 'loading') return;
            const style = getComputedStyle(block);
            const left = content.getBoundingClientRect().left;
            const right = block.getBoundingClientRect().right
                - parseFloat(style.paddingRight) - parseFloat(style.borderRightWidth);
            const available = right - left;
            if (available <= 0) return;
            const fontSize = parseFloat(style.fontSize);
            let suffixWidth = 0;
            for (const marker of content.querySelectorAll('.md-syntax.is-editing')) {
                if (last.compareDocumentPosition(marker) & Node.DOCUMENT_POSITION_FOLLOWING) {
                    suffixWidth += marker.getBoundingClientRect().width;
                }
            }

            const text = new Range();
            text.selectNodeContents(last);
            const target = right - suffixWidth;
            if (!adjustLineSpacing(content, text, target, 'wordSpacing', -fontSize * 0.08)) {
                const tail = last.querySelector('.md-track-end') || markFinalGlyph(block, content, last.firstChild);
                if (tail) {
                    text.selectNodeContents(tail);
                    adjustLineSpacing(content, text, target, 'letterSpacing', -fontSize * 0.05);
                }
            }

            // Once the spacing can no longer tighten, preserve the height and fit the line horizontally.
            const used = text.getBoundingClientRect().right + suffixWidth - left;
            if (used - available > 0.05) content.style.transform = `scaleX(${available / used})`;
        }

        function adjustLineSpacing(content, text, right, property, minimum) {
            const natural = text.getBoundingClientRect().right;
            const extra = right - natural;
            if (Math.abs(extra) < 0.05) return true;
            const probe = 8;
            content.style[property] = `${probe}px`;
            const gaps = Math.round((text.getBoundingClientRect().right - natural) / probe);
            content.style[property] = '';
            if (gaps <= 0) return false;

            let spacing = Math.max(minimum, extra / gaps);
            for (let pass = 0; pass < 4; pass++) {
                content.style[property] = `${spacing}px`;
                const used = text.getBoundingClientRect().right - natural;
                if (!used || Math.abs(extra - used) < 0.05 || (spacing === minimum && used > extra)) break;
                spacing = Math.max(minimum, spacing * extra / used);
            }
            return true;
        }

        function markFinalGlyph(block, content, node) {
            if (!node || node.nodeType !== Node.TEXT_NODE) return;

            // Find the final shaped glyph via the width added by one pixel of tracking.
            // A partial range inside a ligature receives only a fraction of that pixel.
            const range = new Range();
            const starts = [...graphemes.segment(node.data)].map(({ index }) => index).reverse();
            const measure = index => {
                range.setStart(node, index);
                range.setEnd(node, node.length);
                return range.getBoundingClientRect().width;
            };
            const natural = starts.map(measure);
            content.style.letterSpacing = '1px';
            const clusterStart = starts.find((index, i) => measure(index) - natural[i] >= 0.95) ?? 0;
            content.style.letterSpacing = '';

            const selection = window.getSelection();
            const caret = selection?.isCollapsed ? saveCaretPos(block) : null;
            const tail = document.createElement('span');
            tail.className = 'md-track-end';
            range.setStart(node, clusterStart);
            range.setEnd(node, node.length);
            range.surroundContents(tail);
            restoreCaretPos(block, caret);
            return tail;
        }

        function layoutBlock(block) {
            if (block.classList.contains('line-fit')) fitBlock(block);
            else if (block.classList.contains('line-justify')) justifyLine(block);
        }

        function layoutMarkedBlocks() {
            editor.querySelectorAll(widthDependentBlocks).forEach(layoutBlock);
        }

        function decorateBlock(block) {
            if (!block || block === editor) return;
            const text = block.textContent;

            if (!text) {
                block.innerHTML = '<br>';
                block.className = '';
                return;
            }

            const caret = saveCaretPos(block);
            const { html, cls } = buildDecoration(text);
            block.innerHTML = html;
            block.className = cls;
            if (!block.classList.contains('line-fit')) window.XSFSyllables?.decorate(block);
            layoutBlock(block);
            restoreCaretPos(block, caret);
            updateSyntaxVisibility();
        }

        let layoutWidth;
        new ResizeObserver(([entry]) => {
            const { width } = entry.contentRect;
            if (width === layoutWidth) return;
            layoutWidth = width;
            layoutMarkedBlocks();
        }).observe(editor);
        document.fonts.addEventListener('loadingdone', layoutMarkedBlocks);
        document.fonts.addEventListener('loadingerror', layoutMarkedBlocks);

        // ---- Placeholder ----

        function updatePlaceholder() {
            editor.setAttribute('data-empty', editor.textContent.trim() === '' ? 'true' : 'false');
        }

        // ---- Save / Load Core ----

        function getMarkdown() {
            return Array.from(editor.children).map(b => b.textContent).join('\n\n');
        }

        async function verifyPermission(handle) {
            const opts = { mode: 'readwrite' };
            try {
                if ((await handle.queryPermission(opts)) === 'granted') return true;
                if ((await handle.requestPermission(opts)) === 'granted') return true;
            } catch (e) {
                console.error('Error sol·licitant permís:', e);
            }
            return false;
        }

        async function saveContent() {
            const md = getMarkdown();
            localStorage.setItem(STORAGE_KEY, md);

            if (fileHandle) {
                try {
                    const hasPerm = await verifyPermission(fileHandle);
                    if (!hasPerm) {
                        updateTitle(true);
                        return;
                    }
                    const writable = await fileHandle.createWritable();
                    await writable.write(md);
                    await writable.close();
                    updateTitle(false);
                } catch (err) {
                    console.error('Error desant al fitxer sincronitzat:', err);
                    updateTitle(true);
                }
            }
        }

        function loadIntoEditor(md) {
            editor.innerHTML = '';
            if (!md || !md.trim()) {
                const div = document.createElement('div');
                div.innerHTML = '<br>';
                editor.appendChild(div);
                updatePlaceholder();
                return;
            }
            md.split(/\r\n?|\n/).filter(l => l.trim() !== '').forEach(line => {
                const div = document.createElement('div');
                div.textContent = line;
                editor.appendChild(div);
                decorateBlock(div);
            });
            updatePlaceholder();
        }

        // Auto-load on init from localStorage / Stored File Handle
        loadIntoEditor(localStorage.getItem(STORAGE_KEY) || '');

        (async () => {
            const restoredHandle = await getStoredHandle();
            if (restoredHandle) {
                fileHandle = restoredHandle;
                try {
                    const file = await fileHandle.getFile();
                    const text = await file.text();
                    loadIntoEditor(text);
                    updateTitle();
                } catch (e) {
                    console.log('Handle emmagatzemat no vàlid:', e);
                }
            }
        })();

        // ---- Sync File (Ctrl+Q) ----

        async function syncLocalFile() {
            if ('showOpenFilePicker' in window) {
                try {
                    const [handle] = await window.showOpenFilePicker({
                        types: [{
                            description: 'Fitxers Markdown',
                            accept: { 'text/markdown': ['.md', '.markdown', '.txt'] }
                        }],
                        multiple: false
                    });

                    // Explicitly request write permissions during user activation gesture
                    const opts = { mode: 'readwrite' };
                    if ((await handle.queryPermission(opts)) !== 'granted') {
                        const perm = await handle.requestPermission(opts);
                        if (perm !== 'granted') {
                            alert("⚠️ Cal concedir permís d'escriptura per sincronitzar el fitxer en temps real.");
                            return;
                        }
                    }

                    fileHandle = handle;
                    await setStoredHandle(handle);

                    const file = await fileHandle.getFile();
                    const text = await file.text();
                    loadIntoEditor(text);
                    updateTitle();
                    await saveContent();
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        console.error('Error durant la sincronització:', err);
                        alert("⚠️ Error en obrir o sincronitzar el fitxer.");
                    }
                }
            } else {
                fallbackFileInput.click();
            }
        }

        fallbackFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                loadIntoEditor(evt.target.result);
                saveContent();
            };
            reader.readAsText(file);
        });

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && (e.key === 'q' || e.key === 'Q')) {
                e.preventDefault();
                syncLocalFile();
            }
        });

        // ---- Input handler ----

        let composing = false;
        editor.addEventListener('compositionstart', () => { composing = true; });
        editor.addEventListener('compositionend', () => {
            composing = false;
            decorateBlock(getActiveBlock());
            updatePlaceholder();
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(saveContent, 500);
        });
        editor.addEventListener('input', (e) => {
            if (composing || e.isComposing) return;
            const block = getActiveBlock();

            if (e.inputType === 'insertParagraph' && block) {
                if (block.previousElementSibling) decorateBlock(block.previousElementSibling);
                decorateBlock(block);
            } else if (block) {
                decorateBlock(block);
            }

            updatePlaceholder();
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(saveContent, 500);
        });

        // ---- Em dash: -- → — ----

        editor.addEventListener('keydown', (e) => {
            if (e.key !== '-') return;
            const sel = window.getSelection();
            if (!sel.rangeCount) return;
            const range = sel.getRangeAt(0);
            if (range.startContainer.nodeType !== Node.TEXT_NODE) return;

            const text = range.startContainer.textContent;
            const off = range.startOffset;
            if (off < 1 || text[off - 1] !== '-') return;

            e.preventDefault();
            const node = range.startContainer;
            node.textContent = text.substring(0, off - 1) + '—' + text.substring(off);

            const r = document.createRange();
            r.setStart(node, off);
            r.collapse(true);
            sel.removeAllRanges();
            sel.addRange(r);

            const block = getActiveBlock();
            if (block) decorateBlock(block);

            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(saveContent, 500);
        });

        // ---- Paste as plain text ----

        editor.addEventListener('paste', (e) => {
            e.preventDefault();
            document.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
        });
    </script>
</body>
</html>
