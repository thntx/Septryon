name: XSF syllable tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syllables:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test xsf-syllables.test.cjs
